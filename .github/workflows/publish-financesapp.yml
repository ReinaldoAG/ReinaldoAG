name: Publish FinancesApp update payload

on:
  push:
    paths:
      - '.github/workflows/publish-financesapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FinancesApp build 67
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f3e0-820e-a436-17181e39cd25/raw?se=2026-09-12T01%3A48%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=31d015ba-d1e4-537f-92b0-a871bdd71ac5&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T09%3A41%3A27Z&ske=2026-09-12T09%3A41%3A27Z&sks=b&skv=2026-02-06&sig=JHtSPJaA/CmQdIkU0xftKWNJ3tcFLSSMWvLsr1WUMJo%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/finances.zip
          rm -rf /tmp/finances && mkdir -p /tmp/finances
          unzip -o /tmp/finances.zip -d /tmp/finances
          mkdir -p financesapp-updates
          cp /tmp/finances/FinancesApp-debug.apk financesapp-updates/FinancesApp.apk
          cat > financesapp-updates/update.json <<'EOF'
          {
            "versionCode": 67,
            "versionName": "1.2.67",
            "apkUrl": "https://raw.githubusercontent.com/ReinaldoAG/ReinaldoAG/main/financesapp-updates/FinancesApp.apk",
            "notes": "Actualización interna de FinancesApp"
          }
          EOF
      - name: Commit public updater payload
        run: |
          git config user.name "FinancesApp Updater"
          git config user.email "actions@github.com"
          git add financesapp-updates/FinancesApp.apk financesapp-updates/update.json
          git commit -m "Publish FinancesApp v1.2.67" || exit 0
          git push
