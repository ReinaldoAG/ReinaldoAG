name: Publish FinancesApp update payload

on:
  push:
    paths:
      - '.github/workflows/publish-financesapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FinancesApp build 80
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9fd0-820e-80f4-c596e31c7f96/raw?se=2026-09-12T13%3A39%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=d7428ef1-da2a-58de-8eee-f741b5513039&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T10%3A41%3A40Z&ske=2026-09-13T10%3A41%3A40Z&sks=b&skv=2026-02-06&sig=ftkDH75VXRJw7K38ik93kFx9JVYZzogQkV4QX3VX3R0%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/finances.zip
          rm -rf /tmp/finances && mkdir -p /tmp/finances
          unzip -o /tmp/finances.zip -d /tmp/finances
          mkdir -p financesapp-updates
          cp /tmp/finances/FinancesApp-debug.apk financesapp-updates/FinancesApp.apk
          cat > financesapp-updates/update.json <<'EOF'
          {
            "versionCode": 80,
            "versionName": "1.2.80",
            "apkUrl": "https://raw.githubusercontent.com/ReinaldoAG/ReinaldoAG/main/financesapp-updates/FinancesApp.apk",
            "notes": "Muestra siempre la versión instalada y evita restaurar una interfaz vieja del WebView"
          }
          EOF
      - name: Commit public updater payload
        run: |
          git config user.name "FinancesApp Updater"
          git config user.email "actions@github.com"
          git add financesapp-updates/FinancesApp.apk financesapp-updates/update.json
          git commit -m "Publish FinancesApp v1.2.80" || exit 0
          git push
