name: Publish FinancesApp update payload

on:
  push:
    paths:
      - '.github/workflows/publish-financesapp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FinancesApp build 87
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-66a4-820e-b89e-6dfa271877c4/raw?se=2026-09-14T23%3A55%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=a5af5591-f83e-5d37-a8f5-5ae9ff0430b4&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A10%3A21Z&ske=2026-09-15T20%3A10%3A21Z&sks=b&skv=2026-02-06&sig=98W/EDzFqXjJhZyEfy2Pwol8zxb03vUN9kdkeu65CsA%3D'
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/finances.zip
          rm -rf /tmp/finances && mkdir -p /tmp/finances
          unzip -o /tmp/finances.zip -d /tmp/finances
          mkdir -p financesapp-updates
          cp /tmp/finances/FinancesApp-debug.apk financesapp-updates/FinancesApp.apk
          cat > financesapp-updates/update.json <<'EOF'
          {
            "versionCode": 87,
            "versionName": "1.2.87",
            "apkUrl": "https://raw.githubusercontent.com/ReinaldoAG/ReinaldoAG/main/financesapp-updates/FinancesApp.apk",
            "notes": "Permite saldar pagos individuales o varios de una vez, incluyendo todas las cuotas futuras, sin volver a cobrarlos en meses siguientes"
          }
          EOF
      - name: Commit public updater payload
        run: |
          git config user.name "FinancesApp Updater"
          git config user.email "actions@github.com"
          git add financesapp-updates/FinancesApp.apk financesapp-updates/update.json
          git commit -m "Publish FinancesApp v1.2.87" || exit 0
          git push
